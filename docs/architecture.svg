<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Architecture diagram">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1100" height="420" rx="20" fill="#0B1220"/>
  <text x="40" y="42" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Поток обработки</text>
  <text x="40" y="68" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">MAX webhook → router → FSM | FAQ | LLM idle</text>

  <!-- boxes row 1 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="100" width="160" height="70" rx="14" fill="url(#card)" stroke="#334155"/>
    <text x="120" y="132" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="700">MAX</text>
    <text x="120" y="154" text-anchor="middle" fill="#94A3B8" font-size="12">Messenger</text>

    <rect x="260" y="100" width="160" height="70" rx="14" fill="url(#card)" stroke="#334155"/>
    <text x="340" y="132" text-anchor="middle" fill="#2DD4BF" font-size="14" font-weight="700">nginx</text>
    <text x="340" y="154" text-anchor="middle" fill="#94A3B8" font-size="12">TLS :443</text>

    <rect x="480" y="100" width="180" height="70" rx="14" fill="url(#card)" stroke="#334155"/>
    <text x="570" y="132" text-anchor="middle" fill="#A78BFA" font-size="14" font-weight="700">FastAPI / uvicorn</text>
    <text x="570" y="154" text-anchor="middle" fill="#94A3B8" font-size="12">POST /webhook</text>

    <rect x="720" y="100" width="180" height="70" rx="14" fill="url(#card)" stroke="#334155"/>
    <text x="810" y="132" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">BotRouter</text>
    <text x="810" y="154" text-anchor="middle" fill="#94A3B8" font-size="12">handle_update</text>

    <rect x="940" y="100" width="120" height="70" rx="14" fill="url(#card)" stroke="#334155"/>
    <text x="1000" y="132" text-anchor="middle" fill="#FDBA74" font-size="14" font-weight="700">SQLite</text>
    <text x="1000" y="154" text-anchor="middle" fill="#94A3B8" font-size="12">sessions</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M200 135 H255"/>
    <path d="M420 135 H475"/>
    <path d="M660 135 H715"/>
    <path d="M900 135 H935"/>
  </g>

  <!-- branch boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="120" y="250" width="220" height="100" rx="14" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="230" y="285" text-anchor="middle" fill="#7DD3FC" font-size="15" font-weight="700">FSM заявка</text>
    <text x="230" y="310" text-anchor="middle" fill="#94A3B8" font-size="12">тема → описание → контакт</text>
    <text x="230" y="330" text-anchor="middle" fill="#94A3B8" font-size="12">срочность → подтверждение</text>

    <rect x="400" y="250" width="220" height="100" rx="14" fill="url(#card)" stroke="#2DD4BF" stroke-opacity="0.5"/>
    <text x="510" y="285" text-anchor="middle" fill="#5EEAD4" font-size="15" font-weight="700">FAQ / меню</text>
    <text x="510" y="310" text-anchor="middle" fill="#94A3B8" font-size="12">статические ответы</text>
    <text x="510" y="330" text-anchor="middle" fill="#94A3B8" font-size="12">inline keyboards</text>

    <rect x="680" y="250" width="280" height="100" rx="14" fill="url(#card)" stroke="#FB923C" stroke-opacity="0.55"/>
    <text x="820" y="285" text-anchor="middle" fill="#FDBA74" font-size="15" font-weight="700">LLM idle (Groq)</text>
    <text x="820" y="310" text-anchor="middle" fill="#94A3B8" font-size="12">только free-text вне FSM</text>
    <text x="820" y="330" text-anchor="middle" fill="#94A3B8" font-size="12">LLM_ENABLED kill-switch</text>
  </g>

  <!-- lines from router to branches -->
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M780 170 C 780 210, 230 210, 230 245"/>
    <path d="M810 170 C 810 210, 510 210, 510 245"/>
    <path d="M840 170 C 840 210, 820 210, 820 245"/>
  </g>

  <text x="40" y="400" fill="#475569" font-family="ui-monospace, Menlo, monospace" font-size="12">
    LLM не вмешивается в FSM · fallback → главное меню · admin channel notify
  </text>
</svg>
