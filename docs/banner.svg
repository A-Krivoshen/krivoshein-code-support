<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Krivoshein Code Support">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320"/>
  </g>

  <!-- glow orbs -->
  <circle cx="980" cy="70" r="90" fill="url(#glow)"/>
  <circle cx="180" cy="260" r="110" fill="#818CF8" opacity="0.12"/>

  <!-- accent bar -->
  <rect x="48" y="48" width="8" height="224" rx="4" fill="url(#accent)"/>

  <!-- icon: chat bubble + code -->
  <g transform="translate(90, 88)" filter="url(#soft)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <path d="M28 34 h40 a8 8 0 0 1 8 8 v28 a8 8 0 0 1 -8 8 H44 l-12 12 v-12 H28 a8 8 0 0 1 -8 -8 V42 a8 8 0 0 1 8 -8 z"
          fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M38 52 l-8 10 8 10 M58 52 l8 10 -8 10 M50 50 l-6 24"
          fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- titles -->
  <text x="220" y="130" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5">
    Krivoshein Code Support
  </text>
  <text x="220" y="175" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" font-size="22" font-weight="500">
    MAX support bot · FSM tickets · Groq LLM · FastAPI webhook
  </text>

  <!-- pills -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600">
    <rect x="220" y="210" width="110" height="34" rx="17" fill="#0EA5E9" opacity="0.18" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="275" y="232" text-anchor="middle" fill="#7DD3FC">Python 3.12</text>

    <rect x="344" y="210" width="88" height="34" rx="17" fill="#14B8A6" opacity="0.18" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="388" y="232" text-anchor="middle" fill="#5EEAD4">FastAPI</text>

    <rect x="446" y="210" width="72" height="34" rx="17" fill="#F97316" opacity="0.16" stroke="#FB923C" stroke-width="1.5"/>
    <text x="482" y="232" text-anchor="middle" fill="#FDBA74">Groq</text>

    <rect x="532" y="210" width="70" height="34" rx="17" fill="#A855F7" opacity="0.16" stroke="#C084FC" stroke-width="1.5"/>
    <text x="567" y="232" text-anchor="middle" fill="#D8B4FE">aiosqlite</text>

    <rect x="616" y="210" width="78" height="34" rx="17" fill="#64748B" opacity="0.22" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="655" y="232" text-anchor="middle" fill="#E2E8F0">MAX API</text>
  </g>

  <text x="220" y="278" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    support.krivoshein.site  ·  kill-switch LLM_ENABLED
  </text>
</svg>
